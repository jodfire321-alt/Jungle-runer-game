<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jungle Runner 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#07130d;font-family:Arial;color:white}
#game{width:100vw;height:100dvh;display:block;touch-action:none}
#hud{position:absolute;top:14px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.panel{background:#07170cdd;border:1px solid #d7ad48;border-radius:12px;padding:10px 13px;font-weight:bold;font-size:15px}
#menu{position:absolute;inset:0;background:linear-gradient(#03180a55,#03180aeF);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}
h1{font-size:clamp(36px,10vw,56px);color:#ffce51;margin:0;text-shadow:0 4px #63420d}
p{line-height:1.6;color:#e0ead8}
button{touch-action:manipulation;cursor:pointer;font-weight:bold}
#play{padding:15px 35px;border:0;border-radius:13px;background:linear-gradient(#ffe16d,#d98b19);font-size:20px;color:#211500}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
.group{display:flex;gap:9px;pointer-events:auto}
.ctrl{width:58px;height:58px;border-radius:16px;border:1px solid #e9c65c;background:#07180dd9;color:white;font-size:24px}
.hidden{display:none!important}
#hint{font-size:12px;color:#c5d8b7;margin-top:16px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
 <div class="panel">🪙 <span id="coins">0</span></div>
 <div class="panel">🏃 <span id="distance">0</span> m</div>
</div>
<div id="menu">
 <div style="font-size:50px">🌴 🛕 🌴</div>
 <h1 id="title">JUNGLE<br>RUNNER 3D</h1>
 <p id="description">RUN • COLLECT • SURVIVE<br>Collect coins and avoid obstacles!</p>
 <button id="play">▶ PLAY NOW</button>
 <div id="hint">Swipe left/right to move • Swipe up to jump</div>
</div>
<div id="controls" class="hidden">
 <div class="group">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="right">▶</button>
 </div>
 <div class="group">
  <button class="ctrl" id="slide">▼</button>
  <button class="ctrl" id="jump">⬆</button>
 </div>
</div>
<script type="module">
const canvas=document.querySelector('#game');
const ctx=canvas.getContext('2d');
const menu=document.querySelector('#menu');
const hud=document.querySelector('#hud');
const controls=document.querySelector('#controls');
const $=id=>document.getElementById(id);

let W=innerWidth,H=innerHeight,DPR=1;
function resize(){
 DPR=Math.min(devicePixelRatio||1,1.7);
 W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;canvas.height=H*DPR;
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

let running=false,gameOver=false,last=0,clock=0,meters=0,coins=0;
let lane=0,playerX=0,jumpY=0,jumpV=0,sliding=0,spawn=0,speed=.42;
let objects=[],decor=[],best=0;

function makeScene(){
 decor=[];
 for(let i=0;i<36;i++){
  decor.push({side:i%2?1:-1,z:Math.random(),offset:Math.random()*.8,
   size:.65+Math.random()*.8,type:Math.random()});
 }
}
makeScene();

function project(z,lanePos=0){
 let t=Math.max(0,Math.min(1,z));
 return {
  x:W/2+lanePos*(W*.09+t*W*.31),
  y:H*.31+t*t*H*.70,
  s:.12+t*1.4
 };
}
function polygon(points,color){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.moveTo(points[0][0],points[0][1]);
 points.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));
 ctx.closePath();ctx.fill();
}
function tree(x,y,s,type){
 ctx.fillStyle='#4d3521';
 ctx.fillRect(x-5*s,y-46*s,10*s,49*s);
 const greens=['#12482a','#1b5c31','#246a35'];
 for(let i=0;i<3;i++){
  ctx.fillStyle=greens[(i+Math.floor(type*3))%3];
  ctx.beginPath();ctx.arc(x+(i-1)*13*s,y-48*s,19*s,0,Math.PI*2);ctx.fill();
 }
}
function background(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#69b4d7');g.addColorStop(.4,'#9dbf7c');g.addColorStop(1,'#183c20');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 polygon([[0,H*.36],[W*.17,H*.13],[W*.3,H*.34],[W*.5,H*.12],[W*.7,H*.35],[W*.88,H*.16],[W,H*.35],[W,H],[0,H]],'#315e37');
 // distant temple
 ctx.fillStyle='#918365';
 ctx.fillRect(W*.42,H*.245,W*.16,H*.07);
 polygon([[W*.39,H*.25],[W*.5,H*.17],[W*.61,H*.25]],'#726347');
 ctx.fillStyle='#344b30';ctx.fillRect(W*.475,H*.26,W*.05,H*.055);
 // track
 polygon([[W*.42,H*.31],[W*.58,H*.31],[W*1.13,H],[W*-.13,H]],'#766b4b');
 polygon([[W*.45,H*.31],[W*.55,H*.31],[W*.87,H],[W*.13,H]],'#b6a274');
 // forest
 decor.forEach(d=>{
  let z=(d.z+clock*speed*.12)%1;
  let x=W/2+d.side*(W*.24+z*W*.42+d.offset*W*.1);
  let y=H*.31+z*z*H*.68;
  tree(x,y,d.size*(.2+z),d.type);
 });
 // paving
 for(let i=0;i<14;i++){
  let z=((i/14+clock*speed*.4)%1);
  let y=H*.31+z*z*H*.70;
  let half=W*(.08+z*.33);
  ctx.strokeStyle='#857953';ctx.lineWidth=1+z*2;
  ctx.beginPath();ctx.moveTo(W/2-half,y);ctx.lineTo(W/2+half,y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2-half*.35,y);ctx.lineTo(W/2-half*.35,y+z*9);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2+half*.35,y);ctx.lineTo(W/2+half*.35,y+z*9);ctx.stroke();
 }
}
function drawPlayer(){
 playerX+=(lane-playerX)*.2;
 const p=project(.12,playerX);
 const x=p.x,y=H*.81-jumpY,s=Math.min(W/390,1.35);
 ctx.fillStyle='#10231788';
 ctx.beginPath();ctx.ellipse(x,H*.82,28*s,8*s,0,0,Math.PI*2);ctx.fill();
 if(sliding>0){
  ctx.fillStyle='#5d3b26';ctx.fillRect(x-23*s,y-14*s,46*s,15*s);
  ctx.fillStyle='#d5a77a';ctx.beginPath();ctx.arc(x+20*s,y-13*s,8*s,0,Math.PI*2);ctx.fill();
  return;
 }
 ctx.strokeStyle='#282e2b';ctx.lineWidth=9*s;ctx.lineCap='round';
 ctx.beginPath();
 ctx.moveTo(x-8*s,y-22*s);ctx.lineTo(x-13*s,y-5*s);
 ctx.moveTo(x+8*s,y-22*s);ctx.lineTo(x+15*s,y-5*s);ctx.stroke();
 ctx.fillStyle='#5c3822';ctx.fillRect(x-14*s,y-57*s,28*s,36*s);
 ctx.fillStyle='#d3c7a2';ctx.fillRect(x-12*s,y-53*s,24*s,5*s);
 ctx.fillStyle='#bd8052';ctx.beginPath();ctx.arc(x,y-69*s,13*s,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#352419';ctx.beginPath();ctx.arc(x,y-73*s,13*s,Math.PI,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#bd8052';ctx.lineWidth=7*s;
 ctx.beginPath();ctx.moveTo(x-12*s,y-49*s);ctx.lineTo(x-23*s,y-34*s);
 ctx.moveTo(x+12*s,y-49*s);ctx.lineTo(x+23*s,y-35*s);ctx.stroke();
}
function drawObjects(){
 objects.forEach(o=>{
  let p=project(o.z,o.l);
  if(o.z<0||o.z>1.1)return;
  if(o.type==='coin'){
   let r=10*p.s;
   ctx.fillStyle='#ffce37';ctx.strokeStyle='#fff0a3';ctx.lineWidth=2*p.s;
   ctx.beginPath();ctx.ellipse(p.x,p.y-20*p.s,r,r*1.3,0,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.fillStyle='#9d620b';ctx.font=`bold ${12*p.s}px Arial`;
   ctx.textAlign='center';ctx.fillText('$',p.x,p.y-16*p.s);
  }else{
   let w=35*p.s,h=34*p.s;
   ctx.fillStyle='#59422b';ctx.fillRect(p.x-w/2,p.y-h,w,h);
   ctx.fillStyle='#ae8747';ctx.fillRect(p.x-w/2,p.y-h,w,6*p.s);
   ctx.strokeStyle='#30251b';ctx.lineWidth=2*p.s;ctx.strokeRect(p.x-w/2,p.y-h,w,h);
  }
 });
}
function render(){
 ctx.clearRect(0,0,W,H);background();drawObjects();drawPlayer();
}
function start(){
 running=true;gameOver=false;clock=0;meters=0;coins=0;
 lane=0;playerX=0;jumpY=0;jumpV=0;sliding=0;
 speed=.42;spawn=.7;objects=[];
 $('coins').textContent='0';$('distance').textContent='0';
 menu.classList.add('hidden');hud.classList.remove('hidden');controls.classList.remove('hidden');
}
function finish(){
 running=false;gameOver=true;best=Math.max(best,Math.floor(meters));
 menu.classList.remove('hidden');hud.classList.add('hidden');controls.classList.add('hidden');
 $('title').innerHTML='GAME<br>OVER';
 $('description').innerHTML=`Distance: ${Math.floor(meters)} m<br>Coins: ${coins}<br>Best this session: ${best} m`;
 $('play').textContent='↻ PLAY AGAIN';
 $('hint').textContent='Tap Play Again to run once more';
}
function move(d){if(running)lane=Math.max(-1,Math.min(1,lane+d))}
function jump(){if(running&&jumpY===0&&sliding<=0)jumpV=470}
function slide(){if(running&&jumpY===0)sliding=.65}
$('play').addEventListener('click',start);
$('left').addEventListener('click',()=>move(-1));
$('right').addEventListener('click',()=>move(1));
$('jump').addEventListener('click',jump);
$('slide').addEventListener('click',slide);
addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')move(-1);
 if(e.key==='ArrowRight'||e.key==='d')move(1);
 if(e.key==='ArrowUp'||e.key===' ')jump();
 if(e.key==='ArrowDown')slide();
});
let sx=0,sy=0;
canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
canvas.addEventListener('pointerup',e=>{
 if(!running)return;
 const dx=e.clientX-sx,dy=e.clientY-sy;
 if(Math.abs(dx)>25)move(dx>0?1:-1);
 else if(Math.abs(dy)>25){if(dy<0)jump();else slide()}
});
function update(dt){
 if(!running)return;
 clock+=dt;meters+=dt*speed*14;
 speed=Math.min(.8,.42+meters/9000);
 if(jumpV>0||jumpY>0){jumpY+=jumpV*dt;jumpV-=1250*dt;if(jumpY<0){jumpY=0;jumpV=0}}
 sliding=Math.max(0,sliding-dt);
 spawn-=dt;
 if(spawn<=0){
  let lane1=Math.floor(Math.random()*3)-1;
  objects.push({l:lane1,z:1,type:Math.random()<.7?'coin':'block'});
  if(Math.random()<.6)objects.push({l:Math.floor(Math.random()*3)-1,z:1.04,type:'coin'});
  spawn=Math.max(.48,1.05-meters/6000);
 }
 for(const o of objects){
  o.z-=speed*dt;
  if(!o.hit&&o.z<.16&&o.z>.07&&o.l===lane){
   if(o.type==='coin'){coins++;o.hit=true;$('coins').textContent=coins}
   else if(jumpY<35&&sliding<=0){finish();break}
   else o.hit=true;
  }
 }
 objects=objects.filter(o=>o.z>0&&!o.hit);
 $('distance').textContent=Math.floor(meters);
}
function loop(t){
 const dt=Math.min((t-last)/1000||0,.04);last=t;
 update(dt);render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
